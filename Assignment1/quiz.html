
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FSD Quiz</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <div class="quiz-container">

        <h1>FSD Quiz</h1>

        <div id="studentInfo" class="student-info"></div>

        <div class="quiz-top">

            <div id="questionNumber">
                Question 1 of 10
            </div>

            <div id="timer">
                01:00
            </div>

        </div>

        <div id="questionBox" class="question-box">

            <h3 id="questionText"></h3>

            <div id="options"></div>

        </div>

        <div class="keyboard-info">
            ↑ ↓ Move &nbsp;&nbsp; | &nbsp;&nbsp; Enter Select
        </div>

        <button id="nextButton" class="submit-btn">
            Next Question
        </button>

    </div>

    <script src="quiz.js"></script>

</body>

</html>
