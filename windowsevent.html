<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Events</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button{
            padding: 10px 20px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script>
        function opennewWindow() {
            window.open("","","width=500px,height=500px");
        }
    </script>
</head>
<body>
    <button onclick="window.open('https://www.google.com')">
        Open Google
    </button>
    <button onclick="opennewWindow()">
        Open New Window
    </button>

</body>
</html>
