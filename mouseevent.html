<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse event</title>
    <style>
        #box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 300px 0 0 300px;
        }
    </style>
    <script>
        function eventcall() {
           alert("Mouse event triggered!");
        }
        function events(){
            alert("Mouse event triggered!");
        }

    </script>
</head>
<body>
   <!-- <div id="box" onclick="eventcall()">This is a box</div> --> 
   <!--  <div id="box" ondblclick="eventcall()">This is a box</div> -->
    <!-- <div id="box" onmouseover="eventcall()">This is a box</div> -->
    <!-- <div id="box" onmouseout="eventcall()">This is a box</div> -->
    <div id="box" onmousedown="eventcall()" >This is a box</div>  
    <div id="box" onmouseup="eventcall()" >This is a box</div>  
</body>
</html>
